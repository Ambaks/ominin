# Pile installée sur le Raspberry Pi (~/omilink/compose.yaml, présent dans
# l'image de base). La configuration de l'appareil — BACKEND_URL et
# DEVICE_TOKEN — vit dans omilink.env sur la partition de démarrage de la
# carte SD (FAT : éditable depuis n'importe quel ordinateur), montée ici en
# .env : appairer ou déplacer un boîtier, c'est éditer ce fichier et
# redémarrer, sans SSH. Réseau hôte : le conteneur atteint l'imprimante sur
# le LAN du restaurant sans NAT. Watchtower tire la nouvelle image dès
# qu'elle est publiée (vérifie toutes les heures) et redémarre le pont. Les
# journaux sont plafonnés pour ménager la carte SD.
services:
  omilink:
    image: ghcr.io/ambaks/omilink:latest
    restart: unless-stopped
    volumes:
      - /boot/firmware/omilink.env:/app/.env:ro
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --cleanup --interval 3600
