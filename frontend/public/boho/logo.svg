<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -110 220 220">
  <!-- Motif kilim BOHO — redessiné d'après la couverture du menu :
       treillis à 45° (3 traits par diagonale, médians interrompus)
       autour d'un losange ouvert. -->
  <g transform="rotate(45)" stroke="#f6e9e6" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="-74" y1="-40" x2="74" y2="-40" />
    <line x1="-74" y1="40" x2="74" y2="40" />
    <line x1="-96" y1="0" x2="-30" y2="0" />
    <line x1="30" y1="0" x2="96" y2="0" />
    <line x1="-40" y1="-74" x2="-40" y2="74" />
    <line x1="40" y1="-74" x2="40" y2="74" />
    <line x1="0" y1="-96" x2="0" y2="-30" />
    <line x1="0" y1="30" x2="0" y2="96" />
    <rect x="-22" y="-22" width="44" height="44" rx="8" />
  </g>
</svg>
