<svg xmlns="http://www.w3.org/2000/svg" viewBox="-84 -84 168 168">
  <!-- Le kilim du logo BOHO, relevé sur le logo fourni par le gérant :
       un carré de deux traits par côté, tourné à 45°, prolongé aux angles,
       une branche vers l'extérieur au milieu de chaque côté, un carré au
       centre. Traits droits, angles vifs. -->
  <g transform="rotate(45)" stroke="#f6e9e6" stroke-width="10" stroke-linejoin="miter" fill="none">
    <line x1="-70" y1="-40" x2="70" y2="-40" />
    <line x1="-70" y1="40" x2="70" y2="40" />
    <line x1="-40" y1="-70" x2="-40" y2="70" />
    <line x1="40" y1="-70" x2="40" y2="70" />
    <line x1="-68" y1="0" x2="-40" y2="0" />
    <line x1="40" y1="0" x2="68" y2="0" />
    <line x1="0" y1="-68" x2="0" y2="-40" />
    <line x1="0" y1="40" x2="0" y2="68" />
    <rect x="-13" y="-13" width="26" height="26" />
  </g>
</svg>
