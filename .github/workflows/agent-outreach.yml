# Envoi des e-mails à froid, du mardi au vendredi en matinée (08:23 UTC ≈
# 09:23/10:23 Paris selon l'heure d'été — dérive DST assumée). Le plafond
# quotidien (OUTREACH_DAILY_LIMIT) est appliqué côté backend.
name: agent-outreach

on:
  schedule:
    - cron: "23 8 * * 2-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /agent/outreach
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/outreach"
