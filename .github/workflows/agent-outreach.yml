# Envoi des e-mails à froid, du mardi au vendredi, toutes les 2 heures de
# 06:23 à 16:23 UTC (≈ 08:23-18:23 Paris en été — dérive DST assumée) : le
# volume quotidien est étalé sur 6 runs. Chaque run compose et envoie au plus
# OUTREACH_RUN_BATCH_SIZE e-mails ; le plafond quotidien (OUTREACH_DAILY_LIMIT)
# reste appliqué côté backend.
name: agent-outreach

on:
  schedule:
    - cron: "23 6-16/2 * * 2-5"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /agent/outreach
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/outreach"
