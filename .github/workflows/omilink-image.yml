# Image arm64 du pont Omilink, publiée sur GHCR à chaque changement de
# omilink/ ; les Raspberry Pi la tirent via Watchtower (omilink/compose.yaml).
name: omilink-image

on:
  push:
    branches: [main]
    paths: ["omilink/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: omilink
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/ambaks/omilink:latest
            ghcr.io/ambaks/omilink:${{ github.sha }}
