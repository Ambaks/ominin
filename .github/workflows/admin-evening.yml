# Admin : le rappel du soir — les RDV du lendemain, en notification sur les
# appareils abonnés de Marwan et d'Ambaka.
name: admin-evening

on:
  schedule:
    - cron: "0 18 * * *"  # Tous les jours 18:00 UTC (20:00 Paris en été)
  workflow_dispatch:

jobs:
  evening:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le rappel du soir
        run: |
          curl -sf --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.MENU_URL }}/api/admin/push/evening"
      # Échec du workflow : notification à Marwan et Ambaka (une par 6 h au
      # plus, voir lib/admin/alerts.ts). Jamais bloquant.
      - name: Prévenir l'admin
        if: failure()
        run: |
          curl -s --max-time 30 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"Le rappel du soir n'a pas tourné\",\"body\":\"Touche pour ouvrir le run et voir l'erreur.\",\"key\":\"${{ github.workflow }}\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"urgent\":true}" \
            "${{ secrets.MENU_URL }}/api/admin/push/alert" || true
