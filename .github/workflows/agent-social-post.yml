# Réseaux sociaux : publie les posts validés dans l'admin dont l'heure est
# venue — mardi, jeudi et dimanche à 15:30 Paris (social_slot_* côté
# backend), le creux entre les deux services. Les deux horaires couvrent
# l'heure d'été et d'hiver : le passage de trop ne trouve rien à publier.
name: agent-social-post

on:
  schedule:
    - cron: "30 13 * * 0,2,4"  # 15:30 Paris en été
    - cron: "30 14 * * 0,2,4"  # 15:30 Paris en hiver
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /agent/social-post
        run: |
          curl -sf --max-time 300 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/social-post"
      # Échec du workflow : notification à Marwan et Ambaka (une par 6 h au
      # plus, voir lib/admin/alerts.ts). Jamais bloquant.
      - name: Prévenir l'admin
        if: failure()
        run: |
          curl -s --max-time 30 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"Cron en échec : ${{ github.workflow }}\",\"body\":\"Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"key\":\"${{ github.workflow }}\"}" \
            "${{ secrets.MENU_URL }}/api/admin/push/alert" || true
