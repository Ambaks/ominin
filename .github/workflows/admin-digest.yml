# Admin : le point du matin du suivi de projet, en notification sur les
# appareils abonnés de Marwan et d'Ambaka.
name: admin-digest

on:
  schedule:
    - cron: "30 6 * * *"  # Tous les jours 06:30 UTC (08:30 Paris en été)
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le point du matin
        run: |
          curl -sf --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.MENU_URL }}/api/admin/push/digest"
