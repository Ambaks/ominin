# Espace commercial : la tâche quotidienne (confirmations de droit,
# expirations, fins de contrat, e-mails du contrat en attente, rappels).
# L'heure reprend celle du point du matin de l'admin, faute d'heure décidée.
name: commercial-daily

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Lancer la tâche quotidienne
        run: |
          curl -sf --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.MENU_URL }}/api/commercial/cron"
      - name: Prévenir l'admin
        if: failure()
        run: |
          curl -s --max-time 30 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"La tâche des commerciaux n'a pas tourné\",\"body\":\"Touche pour ouvrir le run et voir l'erreur.\",\"key\":\"${{ github.workflow }}\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"urgent\":true}" \
            "${{ secrets.MENU_URL }}/api/admin/push/alert" || true
