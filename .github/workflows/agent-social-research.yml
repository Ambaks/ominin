# Réseaux sociaux : relevé quotidien des résultats et réécriture de la ligne
# éditoriale. Passe avant agent-social-post pour que la publication du jour
# suive déjà la ligne corrigée.
name: agent-social-research

on:
  schedule:
    - cron: "0 12 * * *"  # Tous les jours 12:00 UTC (14:00 Paris en été)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /agent/social-research
        run: |
          curl -sf --max-time 300 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/social-research"
      # Échec du workflow : notification à Marwan et Ambaka (une par 6 h au
      # plus, voir lib/admin/alerts.ts). Jamais bloquant.
      - name: Prévenir l'admin
        if: failure()
        run: |
          curl -s --max-time 30 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"La recherche réseaux sociaux n'a pas tourné\",\"body\":\"Touche pour ouvrir le run et voir l'erreur.\",\"key\":\"${{ github.workflow }}\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"urgent\":true}" \
            "${{ secrets.MENU_URL }}/api/admin/push/alert" || true
