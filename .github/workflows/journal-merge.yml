# Journal de l'équipe : tout ce qui arrive sur main est annoncé dans Discord
# #journal, quel que soit le poste ou l'outil qui l'a envoyé.
name: journal-merge

on:
  push:
    branches: [main]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Annoncer dans #journal
        env:
          TITLE: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_JOURNAL_CHANNEL_ID: ${{ secrets.DISCORD_JOURNAL_CHANNEL_ID }}
        run: |
          # Le titre vient du commit : jq l'échappe, et aucune mention ne notifie.
          jq -n --arg content "🚀 **En ligne : ${TITLE%%$'\n'*}**"$'\n'"$AUTHOR · \`main\` · \`${SHA:0:8}\`" \
            '{content: $content[0:2000], allowed_mentions: {parse: []}}' \
            | curl -sf --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors \
                -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" -H "Content-Type: application/json" \
                -d @- "https://discord.com/api/v10/channels/$DISCORD_JOURNAL_CHANNEL_ID/messages" > /dev/null
      # Échec du workflow : notification à Marwan et Ambaka (une par 6 h au
      # plus, voir lib/admin/alerts.ts). Jamais bloquant.
      - name: Prévenir l'admin
        if: failure()
        run: |
          curl -s --max-time 30 -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" -H "Content-Type: application/json" \
            -d "{\"title\":\"Cron en échec : ${{ github.workflow }}\",\"body\":\"Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"key\":\"${{ github.workflow }}\"}" \
            "${{ secrets.MENU_URL }}/api/admin/push/alert" || true
