# Découverte de restaurants (Google Places) puis qualification, chaque nuit.
# Le sleep laisse la découverte se terminer avant de lancer l'enrichissement
# (les deux jobs sont single-flight côté backend, un chevauchement rend 409).
name: agent-discovery

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /agent/discover
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/discover"
      - name: Wait for discovery to finish
        run: sleep 300
      - name: Trigger /agent/enrich
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/enrich"
