# Lancement exceptionnel du 19/08/2026 à 20h30 Paris (18:30 UTC) : une
# découverte, l'enrichissement, puis — le temps que la qualification
# remplisse le pool — un run d'outreach. Le workflow se supprime ensuite
# lui-même ; la planification normale reprend dès la nuit suivante
# (agent-discovery à 02:37 UTC, agent-outreach à 06:23 UTC).
name: agent-one-shot-20260819

on:
  schedule:
    - cron: "30 18 19 8 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger /agent/discover
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/discover"
      - name: Wait for discovery to finish
        run: sleep 300
      - name: Trigger /agent/enrich
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/enrich"
      - name: Wait for enrichment to qualify the new prospects
        run: sleep 2700
      - name: Trigger /agent/outreach
        run: |
          curl -sf --max-time 120 --retry 6 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Agent-Secret: ${{ secrets.AGENT_TRIGGER_SECRET }}" \
            "${{ secrets.BACKEND_URL }}/agent/outreach"
      - name: Self-delete (one-shot)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-one-shot-20260819.yml
          git commit -m "Remove one-shot agent workflow (fired 2026-08-19)"
          git pull --rebase origin main
          git push
